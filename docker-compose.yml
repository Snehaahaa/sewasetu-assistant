services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: sewasetu123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    expose:
      - "8000"
    environment:
      SCHEME_DEADLINE: ${SCHEME_DEADLINE:-}      # empty = value in config/app.ini; set to extend the application window
      EVAL_RESULTS_DIR: /evals/results
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
      # the address at which people reach this portal; stamped into sign-in tokens and
      # discovery documents, so it must be the public one when deployed
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu
      - ./evals:/evals:ro

  # --- the two assistants (MCP servers over streamable HTTP). Same image and code as the portal, separate
  # processes with separate tool lists; they reach the portal's rules and database through its own functions.
  mcp-citizen:
    build: ./app
    command: ["gunicorn", "--bind", "0.0.0.0:8001", "--workers", "3", "--timeout", "60", "agent.citizen:app"]
    expose:
      - "8001"
    environment: &mcpenv
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      PORTAL_INTERNAL_URL: http://app:8000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
      SCHEME_DEADLINE: ${SCHEME_DEADLINE:-}
    depends_on:
      - db
      - app
    volumes:
      - uploads:/var/sewasetu/uploads

  mcp-officer:
    build: ./app
    command: ["gunicorn", "--bind", "0.0.0.0:8002", "--workers", "2", "--timeout", "60", "agent.officer:app"]
    expose:
      - "8002"
    environment: *mcpenv
    depends_on:
      - db
      - app
    volumes:
      - uploads:/var/sewasetu/uploads

  # --- public HTTPS front door
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
      - mcp-citizen
      - mcp-officer

  scheduler:
    build: ./app
    # Run the deemed-approval job once at startup (so a freshly restored
    # database is brought up to date), then hand over to cron for the nightly run.
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    # internal only — reached by the app over the docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"

volumes:
  caddy_data:
  pgdata:
  uploads:
  applogs:
